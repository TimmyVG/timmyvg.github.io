---
layout: page
# Index page
---
<h1>Proyectos</h1>

<div class="row row-cols-1 row-cols-md-2 g-3">
  {% assign projects = site.projects | sort: 'order' %}
  {% for project in projects %}
    <div class="col">
      <div class="card h-100 position-relative">
        <img src="{{ project.image | relative_url }}" class="card-img-top project-card-image" alt="{{ project.title }}">
        <div class="card-body">
          <h5 class="card-title">
            <a href="{{ project.url | relative_url }}" class="stretched-link text-decoration-none">
              {{ project.title }}
            </a>
          </h5>
          <p class="card-text text-muted">{{ project.role }} · {{ project.engine }}</p>
        </div>
      </div>
    </div>
  {% endfor %}
</div>
